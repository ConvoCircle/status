name: Status probe

on:
  schedule:
    # Every ~15 min, offset from :00 — same grid as socialTrainer prod-health.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
      - "SETUP.md"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: status-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: node --test probe.test.mjs

      - name: Probe live endpoints
        env:
          STATUS_PROBE_RETRY: "1"
          # Optional: actions:read on ConvoCircle/socialTrainer so this page
          # always shows the latest hourly / nightly / health conclusion.
          SOCIALTRAINER_ACTIONS_TOKEN: ${{ secrets.SOCIALTRAINER_ACTIONS_TOKEN }}
        run: node probe.mjs

      - name: Optional incident issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/incident-issue.sh

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets data _site/

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: status-site
          path: _site

      - name: Commit history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json data/history.json
          if git diff --cached --quiet; then
            echo "No history change"
            exit 0
          fi
          git commit -m "$(cat <<EOF
          chore: status snapshot $(date -u +%Y-%m-%dT%H:%MZ)

          [skip ci]
          EOF
          )"
          git pull --rebase --autostash origin HEAD
          git push

  publish:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: status-site
          path: _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
