name: Status probe

on:
  schedule:
    # Every 5 min (GitHub Actions minimum practical interval). Offset from :00.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
      - "SETUP.md"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: status-probe
  # One probe at a time — overlapping runs raced on data/*.json commits
  # and failed the job even when all endpoints were healthy.
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: node --test probe.test.mjs

      - name: Probe live endpoints
        env:
          STATUS_PROBE_RETRY: "1"
        run: node probe.mjs

      - name: Optional incident issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/incident-issue.sh

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets data _site/

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: status-site
          path: _site

      - name: Commit history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Snapshot probe outputs before any rebase so we can re-apply after a race.
          cp data/status.json /tmp/status.probe.json
          cp data/history.json /tmp/history.probe.json
          for attempt in 1 2 3 4 5; do
            git fetch origin
            git reset --hard "origin/$(git rev-parse --abbrev-ref HEAD)"
            cp /tmp/status.probe.json data/status.json
            cp /tmp/history.probe.json data/history.json
            git add data/status.json data/history.json
            if git diff --cached --quiet; then
              echo "No history change"
              exit 0
            fi
            git commit -m "$(cat <<EOF
          chore: status snapshot $(date -u +%Y-%m-%dT%H:%MZ)

          [skip ci]
          EOF
          )"
            if git push origin HEAD; then
              echo "History committed on attempt ${attempt}"
              exit 0
            fi
            echo "Push raced (attempt ${attempt}); retrying…"
            sleep $((attempt * 2))
          done
          echo "::error::Could not commit status history after retries (endpoints were probed; page may be stale until next run)."
          exit 1

  publish:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: status-site
          path: _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
