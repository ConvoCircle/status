name: Status probe

on:
  schedule:
    # Every ~15 min, offset from :00 — same grid as socialTrainer prod-health.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
      - "SETUP.md"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: status-probe
  # Overlap is OK: commit-history.sh retries and cannot fail the job.
  # Do not cancel-in-progress — a flaky dispatch must not drop a good publish.
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit tests
        run: node --test probe.test.mjs

      - name: Probe live endpoints
        env:
          STATUS_PROBE_RETRY: "1"
          # Optional: actions:read on ConvoCircle/socialTrainer so this page
          # always shows the latest hourly / nightly / health conclusion.
          SOCIALTRAINER_ACTIONS_TOKEN: ${{ secrets.SOCIALTRAINER_ACTIONS_TOKEN }}
        run: node probe.mjs

      - name: Optional incident issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/incident-issue.sh

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets data _site/

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: status-site
          path: _site

      # History git races must not fail the job (and skip Pages / email).
      # A fatal probe.mjs error still fails this job before we get here.
      - name: Commit history
        continue-on-error: true
        env:
          PUSH_RETRIES: "5"
          HISTORY_BRANCH: main
        run: bash scripts/commit-history.sh

  publish:
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: status-site
          path: _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
